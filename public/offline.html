<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#465fff">
<title>Sem conexão — Escala</title>
<style>
  :root { --bg:#f9fafb; --fg:#101828; --muted:#667085; --brand:#465fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f2f4f7; --muted:#98a2b3; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:1.25rem; margin:20px 0 6px; }
  p { color:var(--muted); margin:0 0 24px; }
  button { min-height:44px; padding:0 22px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, a escala aparece de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
